name: Build C3
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v2
        with:
          esp_idf_version: v5.4
          target: esp32c3
          command: |
            echo 'CONFIG_BOARD_TYPE_LICHUANG_DEV_C3=y' >> sdkconfig.defaults
            echo 'CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y' >> sdkconfig.defaults
            echo 'CONFIG_USE_ESP_WAKE_WORD=y' >> sdkconfig.defaults
            idf.py set-target esp32c3
            idf.py build
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: build/merged-binary.bin
