name: Build C3

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          . /opt/esp/idf/export.sh || true

          cat > sdkconfig.defaults << 'EOF'
          CONFIG_BOARD_TYPE_LICHUANG_DEV_C3=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_USE_ESP_WAKE_WORD=y
          CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
          CONFIG_USE_EMOTE_MESSAGE_STYLE=y
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_COMPILER_CXX_RTTI=y
          EOF

          idf.py fullclean
          idf.py set-target esp32c3
          idf.py reconfigure

          sed -i 's/^CONFIG_ESPTOOLPY_FLASHSIZE=.*/CONFIG_ESPTOOLPY_FLASHSIZE="4MB"/' sdkconfig
          sed -i 's/^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y/CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y/' sdkconfig
          grep "^CONFIG_ESPTOOLPY_FLASHSIZE" sdkconfig
          idf.py reconfigure

          for f in managed_components/78__xiaozhi-fonts/src/font_emoji_*.c; do
            sed -i 's/.*lv_imgfont_create.*/    font = NULL;/' "$f"
          done
          for f in managed_components/78__xiaozhi-fonts/src/font_puhui_*.c; do
            sed -i '/^#[[:space:]]*error/d' "$f"
          done

          idf.py build || true

          echo "=== GENERATE CORRECT 4MB PARTITION TABLE ==="
          python3 - << 'PY'
          import csv, struct, os

          PART_TYPE = {
              ("data","nvs"): (0x01, 0x02), ("data","ota"): (0x01, 0x00),
              ("data","phy"): (0x01, 0x01), ("app","factory"): (0x00, 0x00),
              ("data","spiffs"): (0x01, 0x82),
          }
          entries = []
          with open("partitions/v2/4m.csv") as f:
              for row in csv.reader(f):
                  row = [c.strip() for c in row if c.strip()]
                  if not row or row[0].startswith('#'): continue
                  k = (row[1], row[2])
                  if k not in PART_TYPE: continue
                  t, st = PART_TYPE[k]
                  entries.append((t, st, int(row[3],16), int(row[4],16), row[0]))

          buf = bytearray()
          for t, st, off, sz, name in entries:
              buf += struct.pack('<HBB', 0x50AA, t, st)
              buf += struct.pack('<II', off, sz)
              buf += name.encode()[:16].ljust(16, b'\x00') + b'\x00'*4
              print(f"  {name}: 0x{off:06X} + 0x{sz:06X} = 0x{off+sz:X} OK")
          buf += b'\xFF' * max(0, 0xC00 - len(buf))
          os.makedirs("build/partition_table", exist_ok=True)
          with open("build/partition_table/partition-table.bin", 'wb') as f: f.write(buf)
          print("Partition table regenerated (factory 3MB)")
          PY

          echo "=== REGENERATE APP WITH CORRECT FLASH SIZE ==="
          python -m esptool --chip esp32c3 elf2image \
            --flash_mode dio --flash_size 4MB --flash_freq 80m \
            -o build/xiaozhi.bin build/xiaozhi.elf

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/**/*.bin
            build/*.elf
            build/*.map
