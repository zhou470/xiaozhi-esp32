name: Build C3

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.2
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          . /opt/esp/idf/export.sh || true

          cat > sdkconfig.defaults << 'EOF'
          CONFIG_BOARD_TYPE_LICHUANG_DEV_C3=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_USE_ESP_WAKE_WORD=y
          CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
          CONFIG_USE_EMOTE_MESSAGE_STYLE=y
          CONFIG_COMPILER_CXX_EXCEPTIONS=y
          CONFIG_COMPILER_CXX_RTTI=y
          CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192
          CONFIG_ESP_SYSTEM_EVENT_TASK_STACK_SIZE=4096
          EOF

          idf.py fullclean
          idf.py set-target esp32c3
          idf.py reconfigure

          sed -i 's/^CONFIG_ESPTOOLPY_FLASHSIZE=.*/CONFIG_ESPTOOLPY_FLASHSIZE="4MB"/' sdkconfig
          sed -i 's/^CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y/CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y/' sdkconfig
          grep "^CONFIG_ESPTOOLPY_FLASHSIZE" sdkconfig
          idf.py reconfigure

          for f in managed_components/78__xiaozhi-fonts/src/font_emoji_*.c; do
            sed -i 's/.*lv_imgfont_create.*/    font = NULL;/' "$f"
          done
          for f in managed_components/78__xiaozhi-fonts/src/font_puhui_*.c; do
            sed -i '/^#[[:space:]]*error/d' "$f"
          done

          idf.py build || true

          echo "=== GENERATE CORRECT 4MB PARTITION TABLE ==="
          python $IDF_PATH/components/partition_table/gen_esp32part.py \
            partitions/v2/4m.csv build/partition_table/partition-table.bin

          echo "=== REGENERATE APP WITH CORRECT FLASH SIZE ==="
          python -m esptool --chip esp32c3 elf2image \
            --flash_mode dio --flash_size 4MB --flash_freq 80m \
            -o build/xiaozhi.bin build/xiaozhi.elf

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/**/*.bin
            build/*.elf
            build/*.map
