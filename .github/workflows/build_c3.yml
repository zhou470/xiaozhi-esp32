name: Build C3
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup ESP-IDF
        run: |
          git clone --depth 1 --branch v5.5.2 https://github.com/espressif/esp-idf.git /opt/esp/idf
          cd /opt/esp/idf
          ./install.sh esp32c3
      - name: Build
        run: |
          . /opt/esp/idf/export.sh
          cat > sdkconfig.defaults << 'EOF'
          CONFIG_BOARD_TYPE_LICHUANG_DEV_C3=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/4m.csv"
          CONFIG_USE_ESP_WAKE_WORD=y
          CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
          EOF
          idf.py fullclean
          idf.py set-target esp32c3
          FONTS=managed_components/78__xiaozhi-fonts
          mkdir -p $FONTS/include $FONTS/src
          echo 'idf_component_register()' > $FONTS/CMakeLists.txt
          for h in font_emoji font_awesome cbin_font font_puhui_14_1 font_puhui_16_4 font_puhui_20_4 font_puhui_30_4 font_puhui_basic_14_1 font_puhui_basic_16_4 font_puhui_basic_20_4 font_noto_basic_14_1 font_noto_basic_16_4; do
            echo "#pragma once" > $FONTS/include/${h}.h
          done
          echo 'void unused(void){}' > $FONTS/src/dummy.c
          idf.py build
          idf.py merge-bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/merged-binary.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
