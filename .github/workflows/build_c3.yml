    done

    idf.py build

    echo "=== FLASH SIZE CHECK ==="
    cat build/flasher_args.json 2>/dev/null || true
    echo "=== IDF SIZE (REAL) ==="
    idf.py size

    echo "=== PARTITION CSV ==="
    cat build/partition_table/partition-table.csv 2>/dev/null || true

    echo "=== FLASH SAFETY CHECK ==="
    python3 - << 'PY'
    import os, json
    try:
      with open("build/flasher_args.json") as f:
          data = json.load(f)
      fs = data.get("flash_settings", {}).get("flash_size", "unknown")
      if fs != "4MB":
          raise SystemExit(f"FAIL: flash_size is {fs}, expected 4MB")
    except Exception as e:
      raise SystemExit(str(e))
    print("FLASH SIZE OK:", fs)
    import os, csv
    # Verify partition table does not exceed 4MB
    with open("build/partition_table/partition-table.csv") as f:
        for row in csv.DictReader(f):
            off = int(row["Offset"].strip(), 16)
            size = int(row["Size"].strip(), 16)
            end = off + size
            if end > 0x400000:
                raise SystemExit(f"FAIL: {row['Name']} at 0x{off:X}+0x{size:X} exceeds 4MB flash")
            print(f"  {row['Name']:16s} 0x{off:06X} + 0x{size:06X} = 0x{end:06X} OK")
    print("ALL PARTITIONS FIT IN 4MB")
    PY

