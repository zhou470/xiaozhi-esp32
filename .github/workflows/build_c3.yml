name: Build C3
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup ESP-IDF
        run: |
          git clone --depth 1 --branch v5.5.2 https://github.com/espressif/esp-idf.git /opt/esp/idf
          cd /opt/esp/idf
          ./install.sh esp32c3
      - name: Build
        run: |
          . /opt/esp/idf/export.sh
          cat > sdkconfig.defaults << 'EOF'
          CONFIG_BOARD_TYPE_LICHUANG_DEV_C3=y
          CONFIG_ESPTOOLPY_FLASHSIZE_4MB=y
          CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/4m.csv"
          CONFIG_USE_ESP_WAKE_WORD=y
          CONFIG_ESP_CONSOLE_USB_SERIAL_JTAG=y
          CONFIG_COMPILER_DISABLE_GCC_WARNINGS_AS_ERRORS=y
          EOF
          idf.py fullclean
          idf.py set-target esp32c3
          find managed_components/78__xiaozhi-fonts/src -name 'font_*.c' -exec sh -c 'echo "void $(basename {} .c)_init(void){}" > {}' \;
          idf.py build
          idf.py merge-bin
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/merged-binary.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/*.bin
